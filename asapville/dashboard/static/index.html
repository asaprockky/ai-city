<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asapville Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an observer's desk on one screen. A "Right now" strip of headlines on top, the town
   map (with speech bubbles) on the left, a tabbed ledger on the right (story, people, town,
   angels, ask), and the clock bar across the bottom. Narrow screens stack it all. */
:root {
  --bg: #eceee7;
  --surface: #f9f9f5;
  --surface-2: #e3e6dc;
  --ink: #1d251f;
  --muted: #5e6b62;
  --line: #cfd5c8;
  --accent: #1f6f6b;
  --accent-ink: #ffffff;
  --accent-soft: #d6e8e5;
  --land: #dfe5d2;
  --land-2: #d2dbc2;
  --water: #a9c9d8;
  --road: #cbd0bf;
  --good: #2f8a5a;
  --warn: #c2871c;
  --crit: #b33a30;
  --night: #0f1a33;
  --bubble: #ffffff;
  --al-lawful: #2d7fb8;
  --al-neutral: #8a8f58;
  --al-selfish: #c7891a;
  --al-cruel: #8f3b8f;
  --al-criminal: #b33a30;
  --shadow: 0 1px 2px rgba(20, 30, 24, .12), 0 8px 24px rgba(20, 30, 24, .08);
  --display: "Bitter", "Iowan Old Style", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121814; --surface: #1a221d; --surface-2: #222c26; --ink: #e6ebe4; --muted: #96a398;
    --line: #2d3932; --accent: #5cc2ba; --accent-ink: #0d1b19; --accent-soft: #1d3b39;
    --land: #1f2b23; --land-2: #26342c; --water: #27485a; --road: #33403a;
    --good: #4fb97e; --warn: #e0a53a; --crit: #e06057; --night: #050912; --bubble: #26332c;
    --al-lawful: #5aa6dc; --al-neutral: #b3b878; --al-selfish: #e0a53a; --al-cruel: #c070c0;
    --al-criminal: #e06057;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1a221d; --surface-2: #222c26; --ink: #e6ebe4; --muted: #96a398;
  --line: #2d3932; --accent: #5cc2ba; --accent-ink: #0d1b19; --accent-soft: #1d3b39;
  --land: #1f2b23; --land-2: #26342c; --water: #27485a; --road: #33403a;
  --good: #4fb97e; --warn: #e0a53a; --crit: #e06057; --night: #050912; --bubble: #26332c;
  --al-lawful: #5aa6dc; --al-neutral: #b3b878; --al-selfish: #e0a53a; --al-cruel: #c070c0;
  --al-criminal: #e06057;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 10px; padding-block: 10px; min-height: 0; }

/* ---------- header */
.top { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.clock { display: flex; flex-direction: column; min-width: 0; }
.clock .big { font-family: var(--display); font-size: 18px; font-weight: 600; }
.clock .small { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.live .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); animation: beat 2s infinite; }
@keyframes beat { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--good) 10%, transparent); } }
.pill.paused .dot, .pill.slow .dot { background: var(--warn); }
.pill.off .dot { background: var(--muted); }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.icon { padding: 6px 9px; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- right now */
.now { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; display: grid; gap: 3px; align-content: start; text-align: left; min-width: 0; }
.card[role=button] { cursor: pointer; }
.card[role=button]:hover { border-color: var(--accent); }
.card .lab { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card .lab i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.card.good .lab i { background: var(--good); } .card.warn .lab i { background: var(--warn); } .card.crit .lab i { background: var(--crit); }
.card .ttl { font-weight: 600; font-size: 15px; line-height: 1.25; }
.card .det { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .faces { display: flex; gap: 2px; margin-top: 2px; }
.card .faces span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 8.5px var(--display); color: #fff; }

/* ---------- main */
.main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, .95fr); gap: 10px; min-height: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.map-wrap { position: relative; }
.map-wrap svg { width: 100%; height: 100%; display: block; }
.map-legend { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 6px 8px; border-radius: 8px; max-width: calc(100% - 20px); }
.map-legend span { display: inline-flex; align-items: center; gap: 4px; }
.map-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.map-hint { position: absolute; right: 10px; top: 10px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 4px 8px; border-radius: 8px; }

.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; gap: 0; overflow-x: auto; flex: none; }
.tab { background: none; border: 0; padding: 10px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 4px; }
.tabpanel { overflow: auto; min-height: 0; flex: 1; padding: 10px; }

/* story */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.hour { display: grid; gap: 6px; padding-bottom: 10px; }
.hourhead { position: sticky; top: -10px; background: var(--surface); padding: 8px 2px 4px; font-family: var(--mono); font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); z-index: 1; display: flex; justify-content: space-between; gap: 8px; }
.hourhead button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; }
.convo { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; }
.convo .where { font-size: 12px; color: var(--muted); font-weight: 600; }
.line { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.mini { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 10px var(--display); color: #fff; background: var(--al-neutral); border: 0; padding: 0; }
.line .who { font-weight: 600; font-size: 13px; }
.line .to { color: var(--muted); font-weight: 400; }
.line q { display: block; font-size: 14px; quotes: "«" "»"; }
.ev { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 3px 4px; align-items: start; font-size: 14px; }
.new { animation: pop .6s ease-out; border-radius: 8px; }
@keyframes pop { from { background: var(--accent-soft); } to { background: transparent; } }
.ev .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); font-size: 12px; }
.ev.trouble .ic { background: color-mix(in srgb, var(--crit) 18%, transparent); }
.ev.angel .ic { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.ev.idea { background: color-mix(in srgb, var(--warn) 9%, transparent); border-radius: 8px; padding: 6px; }
.ev.idea .ic { background: color-mix(in srgb, var(--warn) 25%, transparent); }
.ev q { font-style: italic; quotes: "«" "»"; }
.ev .at { font-size: 12px; color: var(--muted); }
.pname { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink); text-decoration: underline dotted var(--muted); text-underline-offset: 2px; }
.empty { color: var(--muted); padding: 24px 8px; text-align: center; }

/* people */
.citizens { display: grid; gap: 8px; }
.cit { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; background: var(--surface-2); text-align: left; width: 100%; }
.cit:hover { border-color: var(--accent); }
.cit.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cit.dead { opacity: .55; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 15px; color: #fff; background: var(--al-neutral); position: relative; flex: none; }
.avatar.asleep::after { content: "z"; position: absolute; right: -3px; top: -4px; font: 700 11px var(--mono); color: var(--ink); background: var(--surface); border-radius: 50%; width: 16px; height: 16px; display: grid; place-items: center; border: 1px solid var(--line); }
.cit .name { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cit .where { font-size: 12px; color: var(--muted); }
.cit .where .mood { font-style: italic; }
.cit .said { font-size: 12.5px; font-style: italic; color: var(--ink); opacity: .85; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.bars { display: grid; grid-template-columns: repeat(2, 44px); gap: 5px 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 3px; transition: width .4s; }
.bar.warn i { background: var(--warn); } .bar.crit i { background: var(--crit); }
.chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: #fff; background: var(--al-neutral); letter-spacing: .02em; white-space: nowrap; }
.chip.lawful-good { background: var(--al-lawful); } .chip.neutral { background: var(--al-neutral); }
.chip.selfish { background: var(--al-selfish); } .chip.cruel { background: var(--al-cruel); } .chip.criminal { background: var(--al-criminal); }
.chip.soft { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.chip.job { background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent); font-weight: 500; }
.barkey { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-bottom: 8px; }

/* town + angels */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stat .v { font-family: var(--mono); font-size: 20px; font-weight: 500; }
.stat .k { font-size: 12px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
td.num, th.num { text-align: right; }
.budget { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 6px; }
.budget i { display: block; height: 100%; background: var(--accent); }
.shelves { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.shelf { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.shelf .nm { font-weight: 600; font-size: 13px; }
.shelf .it { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
.zero { color: var(--crit); }
.ivs { display: grid; gap: 6px; }
.iv { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.iv.rejected { opacity: .65; }
.iv .t { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.iv .tg { font-weight: 600; }
.iv .why { font-size: 13px; color: var(--muted); }
.anom { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 13px; align-items: start; }
.anom .sev { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 999px; color: #fff; background: var(--warn); }
.anom .sev.hi { background: var(--crit); }
.anom.fixed { opacity: .6; }
.assess { font-style: italic; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; margin-bottom: 10px; }

/* ask */
.ask { display: grid; gap: 10px; align-content: start; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.presets button:hover { border-color: var(--accent); }
.askbox { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.askbox textarea { resize: vertical; min-height: 44px; max-height: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.qa { display: grid; gap: 8px; }
.q { justify-self: end; background: var(--accent-soft); border-radius: 12px 12px 2px 12px; padding: 7px 11px; max-width: 90%; }
.a { background: var(--surface-2); border-radius: 12px 12px 12px 2px; padding: 9px 12px; white-space: pre-wrap; max-width: 100%; }
.a.thinking { color: var(--muted); font-style: italic; }
.note { font-size: 13px; color: var(--muted); }

/* ---------- timeline */
.timeline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.timeline .tl-left, .timeline .tl-right { display: flex; align-items: center; gap: 6px; }
.timeline input[type=range] { width: 100%; accent-color: var(--accent); }
.tl-mid { display: grid; gap: 2px; min-width: 0; }
.tl-mid .lab { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.daystrip { height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.daystrip i { position: absolute; top: 0; bottom: 0; background: var(--night); opacity: .35; }

/* ---------- drawer */
.drawer { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; z-index: 3; }
.drawer .head { display: flex; gap: 12px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); }
.drawer .head .avatar { width: 52px; height: 52px; font-size: 20px; }
.drawer .head h2 { font-size: 20px; }
.drawer .head .meta { font-size: 12px; color: var(--muted); }
.drawer .body { overflow: auto; padding: 12px; display: grid; gap: 16px; align-content: start; }
.drawer .close { margin-left: auto; }
.sec h3 { font-size: 12px; font-family: var(--mono); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.thought { font-style: italic; padding: 8px 12px; color: var(--ink); background: var(--surface-2); border-radius: 10px; margin: 10px 0 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.needs { display: grid; gap: 6px; }
.need { display: grid; grid-template-columns: 84px 1fr 36px; gap: 8px; align-items: center; font-size: 13px; }
.need .bar { height: 8px; }
.traits { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 12px; }
.trait { display: grid; grid-template-columns: 1fr 70px; gap: 6px; align-items: center; }
.trait .bar i { background: var(--accent); }
.trait.dark .bar i { background: var(--crit); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.prose { max-width: 62ch; }
.prose p { margin: 0 0 8px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 9; box-shadow: var(--shadow); }

/* ---------- svg map */
.loc-label { font-family: var(--body); font-size: 11px; font-weight: 600; fill: var(--ink); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.loc-label.small { font-size: 9px; font-weight: 500; fill: var(--muted); stroke: none; }
.bld { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
.bld-roof { fill: var(--accent); opacity: .85; }
.home-roof { fill: var(--muted); }
.plaza { fill: var(--land-2); stroke: var(--road); stroke-width: 1; }
.tree { fill: var(--good); opacity: .8; }
.trunk { fill: var(--muted); }
.water { fill: var(--water); }
.rock { fill: var(--road); stroke: var(--muted); stroke-width: .8; }
.field { stroke: var(--land-2); stroke-width: 4; }
.path { stroke: var(--muted); stroke-dasharray: 3 4; stroke-width: 1.2; fill: none; opacity: .7; }
.agent { cursor: pointer; }
.agent .body { stroke: var(--surface); stroke-width: 2; }
.agent text { font-family: var(--display); font-weight: 700; font-size: 9px; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.agent .zz { font-family: var(--mono); font-size: 9px; fill: var(--ink); font-weight: 500; }
.agent.asleep .body { opacity: .55; }
.agent.dead .body { fill: var(--muted); opacity: .4; }
.agent.dead text, .agent.dead .agent-name { opacity: .5; }
.agent.selected .ring { stroke: var(--accent); stroke-width: 2.5; fill: none; }
.agent .ring { stroke: none; fill: none; }
.agent-name { font-family: var(--body); font-size: 9px; fill: var(--ink); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.night-overlay { fill: var(--night); pointer-events: none; transition: opacity 1s; }
.map-frame { fill: var(--land); }
.grid-line { stroke: var(--land-2); stroke-width: .6; }
.stock-badge { font-family: var(--mono); font-size: 8.5px; fill: var(--muted); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.stock-badge.empty { fill: var(--crit); font-weight: 500; }

    else if (k === 'jail') deco = [-12, -4, 4, 12].map((dx) => `<rect x="${cx + dx - 1}" y="${y + 6}" width="2" height="${h - 12}" fill="var(--ink)"/>`).join('');

  const posCache = new Map();
  function renderMap() {
    const f = curFrame(); if (!f) return;
    const byLoc = new Map(); const paths = []; posCache.clear();
    for (const a of S.agents.values()) {
      const p = agentPos(S.cur, a.id); const fa = frameAgent(f, a.id);
      const el = document.querySelector(`#agents .agent[data-id="${a.id}"]`); if (!el || !p || !fa) continue;
      let x, y;
      if (p.travelling) {
        x = p.x; y = p.y;
        paths.push(`<line class="path" x1="${(p.from.x + .5) * CELL}" y1="${(p.from.y + .5) * CELL}" x2="${(p.to.x + .5) * CELL}" y2="${(p.to.y + .5) * CELL}"/>`);
      } else {
        const l = S.locs.get(p.loc); const n = byLoc.get(p.loc) || 0; byLoc.set(p.loc, n + 1);
        const slots = l.kind === 'home' ? HOME_SLOTS : l.kind === 'square' ? PLAZA_SLOTS : SLOTS;
        const [dx, dy] = slots[n % slots.length]; const ring = Math.floor(n / slots.length) * 14;
        x = (l.x + .5) * CELL + dx; y = (l.y + .5) * CELL + dy + ring;
      }
      posCache.set(a.id, [x, y]);
      el.style.transform = `translate(${x}px, ${y}px)`;
      el.classList.toggle('asleep', !!fa.asleep); el.classList.toggle('dead', !fa.alive);
      el.classList.toggle('selected', S.selected === a.id);
      el.querySelector('.zz').style.display = fa.asleep ? '' : 'none';
      el.querySelector('title').textContent = `${a.name} · ${stateOf(fa, p)} · ${p.travelling ? placeName(p.to) : locName(p.loc)} · ${fa.mood_label}`;
    }
    document.querySelector('#paths').innerHTML = paths.join('');
    const h = f.hour;
    $('night').setAttribute('opacity', h >= 21 || h < 5 ? .3 : h >= 19 ? .18 : h < 7 ? .15 : 0);
    // shelves under the shops
    const stocks = frameStocks(); const e = S.data.economy || {};
    document.querySelectorAll('#badges .stock-badge').forEach((el) => {
      const k = el.dataset.key; const items = Object.entries(stocks[k] || {}).filter(([it]) => !(e.unlimited || []).includes(it));
      const sells = ((e.shops || {})[k] || []).filter((it) => !(e.unlimited || []).includes(it));
      const out = sells.filter((it) => !(stocks[k] || {})[it]);
      el.textContent = items.length ? items.map(([it, q]) => `${item(it)} ${q}`).join(' · ') : (sells.length && out.length ? W().town.soldOut : '');

  }
  // One speech bubble per place: the last thing said (or attempted) there this hour.
  function renderBubbles(f) {
    const evs = S.events.filter((e) => e.tick === f.tick && (e.kind === 'talk' || e.kind === 'improvise') && e.agent_id);
    const byPlace = new Map();
    for (const e of evs) byPlace.set(e.location_id ?? `a${e.agent_id}`, e);
    const out = [];
    for (const e of byPlace.values()) {
      const pos = posCache.get(e.agent_id); if (!pos) continue;
      const a = S.agents.get(e.agent_id);

      const bw = 190, bh = 58;
      const v = S.view; const bx = Math.max(v.x + 4, Math.min(v.x + v.w - bw - 4, pos[0] - bw / 2)), by = Math.max(v.y + 4, pos[1] - bh - 14);
      out.push(`<g class="bubwrap"><foreignObject x="${bx}" y="${by}" width="${bw}" height="${bh}"><div xmlns="http://www.w3.org/1999/xhtml" class="bub ${e.kind === 'improvise' ? 'idea' : ''}"><b>${esc(first(a.name))}:</b> ${esc(text)}</div></foreignObject></g>`);

  // ---------------------------------------------------------------- header + timeline
  function frameStocks() { const f = curFrame(); return (f && f.stocks) || S.data.economy?.stocks || {}; }
  function frameTreasury() { const f = curFrame(); return f && f.treasury != null ? f.treasury : S.data.economy?.treasury; }

    const pill = $('statusPill'); pill.className = 'pill';
    const fresh = S.lastLive && Date.now() - S.lastLive < 3 * 60 * 1000;
    if (S.server && w.paused) { pill.classList.add('paused'); $('statusText').textContent = w.mode === 'budget_paused' ? T.budget : T.paused; }

  // ---------------------------------------------------------------- right now
  function renderNow() {
    const f = curFrame(); if (!f) return; const T = W(); const cards = [];
    const alive = f.agents.filter((x) => x.alive);
    // 1. the biggest crowd away from home
    const groups = new Map();
    for (const x of alive) { if (x.loc == null) continue; const l = S.locs.get(x.loc); if (!l || l.kind === 'home') continue; if (!groups.has(x.loc)) groups.set(x.loc, []); groups.get(x.loc).push(x); }
    const big = [...groups.entries()].sort((a, b) => b[1].length - a[1].length)[0];
    if (big && big[1].length >= 2) {
      const acts = new Map(); for (const x of big[1]) { const k = x.asleep ? 'sleep' : (x.action || 'idle'); acts.set(k, (acts.get(k) || 0) + 1); }
      const top = [...acts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => T.doing[k] || k).join(', ');
      cards.push({ cls: big[1].length >= 5 ? 'warn' : '', lab: T.now.crowd, ttl: T.crowdTtl(big[1].length, locName(big[0])), det: top, faces: big[1].map((x) => x.id), act: () => select(big[1][0].id) });
    }
    // 2. danger
    const risk = alive.filter((x) => x.health < 30 || x.hunger > 75).sort((a, b) => a.health - b.health);
    const dead = [...S.agents.keys()].filter((id) => frameAgent(f, id) && !frameAgent(f, id).alive).length;
    if (risk.length) cards.push({ cls: 'crit', lab: T.now.danger, ttl: risk.slice(0, 3).map((x) => `${first(S.agents.get(x.id).name)} ${x.health}`).join(' · ') + (risk.length > 3 ? ' …' : ''),
      det: (LANG === 'ru' ? 'здоровье из 100' : 'health out of 100') + (dead ? ` · ${T.dangerDead(dead)}` : ''), faces: risk.map((x) => x.id), act: () => select(risk[0].id) });
    else cards.push({ cls: 'good', lab: T.now.calm, ttl: T.dangerNone, det: dead ? T.dangerDead(dead) : '' });
    // 3. economy
    const worked = S.events.filter((e) => e.kind === 'work' && e.data?.success && e.tick <= f.tick && e.tick > f.tick - 6).length;
    const st = frameStocks(); const sum = (it) => Object.values(st).reduce((n, s) => n + (s[it] || 0), 0);
    cards.push({ cls: worked ? 'good' : 'crit', lab: T.now.econ, ttl: T.econTtl(worked), det: T.econDet(sum('bread'), sum('flour'), sum('grain')), act: () => openTab('town') });
    // 4. the newest notable thing
    const notable = S.events.filter((e) => e.tick <= f.tick && !ROUTINE.has(e.kind) && !['talk', 'depart', 'invalid_action', 'buy', 'plan', 'vote'].includes(e.kind)).slice(-1)[0];
    if (notable) cards.push({ cls: notable.kind === 'death' ? 'crit' : notable.kind === 'improvise' ? 'warn' : '', lab: `${T.now.just} · ${hh(frameAt(notable.tick)?.hour ?? 0)}`, ttl: '', det: '', html: evText(notable), act: () => { openTab('story'); } });
    // 5. the last thing said
    const said = S.events.filter((e) => e.tick <= f.tick && e.kind === 'talk').slice(-1)[0];
    if (said) cards.push({ cls: '', lab: `${T.now.said} · ${hh(frameAt(said.tick)?.hour ?? 0)}`, ttl: `${first(S.agents.get(said.agent_id)?.name || '?')} ${T.ev.to} ${first(S.agents.get(said.target_id)?.name || '?')}`, det: `«${said.data?.line || ''}»`, act: () => select(said.agent_id) });
    $('now').innerHTML = cards.map((c, i) => `<div class="card ${c.cls}" data-i="${i}" ${c.act ? 'role="button" tabindex="0"' : ''}>
      <span class="lab"><i></i>${esc(c.lab)}</span>
      ${c.ttl ? `<span class="ttl">${esc(c.ttl)}</span>` : ''}
      ${c.html ? `<span class="det" style="color:var(--ink);-webkit-line-clamp:3">${c.html}</span>` : ''}
      ${c.det ? `<span class="det">${esc(c.det)}</span>` : ''}
      ${c.faces ? `<span class="faces">${c.faces.slice(0, 9).map((id) => { const a = S.agents.get(id); return `<span style="background:${alignColor(a.alignment)}">${esc(initials(a.name))}</span>`; }).join('')}</span>` : ''}
    </div>`).join('');
    $('now').querySelectorAll('.card').forEach((el) => {
      const run = (ev) => { if (ev.target.closest('.pname')) return; const c = cards[Number(el.dataset.i)]; if (c.act) c.act(); };
      el.addEventListener('click', run);
      el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); run(ev); } });

  }

  // ---------------------------------------------------------------- town

  function townContext() {
    const f = curFrame(); const e = S.data.economy || {}; const stocks = frameStocks();
    const lines = [`Asapville at day ${f.day}, ${hh(f.hour)} (${f.part_of_day}, ${f.season}). Town fund: ${Math.round((frameTreasury() || 0) / 100)} asaps.`];
    lines.push('Shelves: ' + Object.entries(stocks).map(([k, s]) => `${k}: ` + Object.entries(s).map(([i, q]) => `${i} ${q}`).join(', ')).join('; '));
    lines.push('Prices (asaps): ' + Object.entries(e.prices || {}).map(([k, v]) => `${k} ${v / 100}`).join(', '));
    lines.push('Jobs: ' + Object.entries(e.jobs || {}).map(([n, j]) => `${n} at ${j.workplace} (${j.wage_cents / 100}/h, uses ${JSON.stringify(j.uses || {})}, makes ${JSON.stringify(j.makes || {})}): ${[...S.agents.keys()].filter((id) => roleAt(id) === n).map((id) => S.agents.get(id).name).join(', ') || 'nobody'}`).join('; '));
    lines.push('Citizens:');
    for (const a of S.agents.values()) {
      const fa = frameAgent(f, a.id); if (!fa) continue; const pos = agentPos(S.cur, a.id);
      lines.push(`- ${a.name} (${a.age}, ${a.alignment}, job ${roleAt(a.id)}): ${!fa.alive ? 'DEAD ' + (a.cause_of_death || '') : `${pos && pos.travelling ? 'walking to ' + pos.to.name : S.locs.get(fa.loc)?.name}, ${fa.asleep ? 'asleep' : fa.action || 'idle'}, hunger ${fa.hunger}, energy ${fa.energy}, health ${fa.health}, ${money(fa.money)} asaps, carries ${JSON.stringify(fa.inventory || {})}, mood "${fa.mood_label}", thinking: "${(fa.thought || '').slice(0, 220)}"`}`);
    }
    lines.push('Recent events (oldest first):');
    const evs = S.events.filter((x) => x.tick <= f.tick && !ROUTINE.has(x.kind)).slice(-90);
    for (const x of evs) { const fr = frameAt(x.tick); lines.push(`[d${fr ? fr.day : '?'} ${fr ? hh(fr.hour) : x.tick}] ${x.kind === 'talk' ? `${S.agents.get(x.agent_id)?.name} to ${S.agents.get(x.target_id)?.name}: "${x.data?.line}"` : x.summary}`); }
    return lines.join('\n');
  }
  async function ask(q) {
    q = (q || '').trim(); if (!q || S.askCtl) return; const T = W().ask;
    openTab('ask');
    if (!sampleFn) { $('askNote').textContent = T.off; return; }
    const entry = { q, a: '', pending: true }; S.qa.push(entry); renderQA();
    $('askInput').value = ''; $('askBtn').disabled = true; $('stopBtn').hidden = false; $('askNote').textContent = '';
    const history = S.qa.slice(-4, -1).filter((x) => x.a && !x.pending).map((x) => `Q: ${x.q}\nA: ${x.a}`).join('\n\n');
    const prompt = `You narrate Asapville, a simulated small town whose citizens are AI agents with real needs, money and permanent death. Answer the viewer's question using ONLY the data below; never invent facts. Be concrete: names, places, numbers, quotes. Keep it short: a few sentences or a short list, plain text, no headings. Answer in ${T.lang}; keep citizens' names as written, and you may translate their quotes.\n\n=== DATA ===\n${townContext()}\n=== END DATA ===\n${history ? `\nEarlier in this conversation:\n${history}\n` : ''}\nQuestion: ${q}`;
    const ctl = new AbortController(); S.askCtl = ctl;
    try {
      const r = await sampleFn(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => { entry.a = text; entry.pending = false; renderQA(); } });
      entry.a = r.text; entry.pending = false;
      if (r.truncated) $('askNote').textContent = T.cut;
    } catch (e) {
      entry.pending = false; entry.a = e && e.text ? e.text : '';
      if (!e || e.code !== 'cancelled') { $('askNote').textContent = T.err[e && e.code] || T.err.other; if (!entry.a) S.qa.pop(); }
      if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) sampleFn = null;
    } finally {
      S.askCtl = null; $('askBtn').disabled = false; $('stopBtn').hidden = true; renderQA();
    }
  }
  $('askBtn').addEventListener('click', () => ask($('askInput').value));
  $('stopBtn').addEventListener('click', () => S.askCtl && S.askCtl.abort());
  $('askInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask($('askInput').value); } });

  }
  function renderAll() {
    document.documentElement.lang = LANG; $('langBtn').textContent = LANG === 'ru' ? 'EN' : 'RU';
    renderTabs(); renderFilters(); renderLegend(); drawMap(); renderAskStatic(); render();
  }
  function goTo(k, { byUser = false } = {}) {
    k = Math.max(0, Math.min(S.frames.length - 1, k));
    if (byUser) S.follow = k === S.frames.length - 1;
    S.cur = k; render();
  }

  // ---------------------------------------------------------------- data in
  function ingest(data) {
    S.data = data;
    S.agents = new Map(data.agents.map((a) => [a.id, a]));
    S.locs = new Map(data.locations.map((l) => [l.id, l]));
    S.frames = data.frames; S.events = data.events;
    S.seenEvent = S.events.length ? S.events[S.events.length - 1].id : 0;
    rebuildRoles();
    $('townName').textContent = data.world.name;
    S.cur = S.frames.length - 1; S.follow = true;
    renderAll();
  }
  function applyUpdate(u) {
    let newHour = null;
    for (const f of u.frames || []) {
      if (!f) continue;
      if (!S.frames.length || f.tick > S.frames[S.frames.length - 1].tick) { S.frames.push(f); newHour = f; }
    }
    if (u.events?.length) { const have = new Set(S.events.map((e) => e.id)); for (const e of u.events) if (!have.has(e.id)) S.events.push(e); S.events.sort((a, b) => a.id - b.id); rebuildRoles(); }
    if (u.world) S.data.world = u.world;
    if (u.cost) S.data.cost = u.cost;
    if (u.economy) S.data.economy = u.economy;
    if (u.angels) S.data.angels = u.angels;
    if (u.relations) S.data.relations = u.relations;
    if (S.follow) S.cur = S.frames.length - 1;
    render();
    if (newHour && !S.follow) toast(W().toastNew(newHour.day, hh(newHour.hour)));
  }

  // Live from the artifact's database: one document per finished hour, pushed while the town runs.
  async function listenDb() {
    if (!window.claude || !window.claude.use) return;
    let db = null; try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) return;
    const since = S.frames.length ? S.frames[S.frames.length - 1].tick : -1;
    try {
      db.collection('ticks').where('tick', '>', since).orderBy('tick').onSnapshot((snap) => {
        const bundles = snap.docChanges().filter((c) => c.type !== 'removed').map((c) => c.doc.data()).sort((a, b) => a.tick - b.tick);
        if (!bundles.length) return;
        if (bundles.some((b) => b.tick > (S.frames[S.frames.length - 1]?.tick ?? -1))) S.lastLive = Date.now();
        const last = bundles[bundles.length - 1];
        applyUpdate({ frames: bundles.map((b) => b.frame), events: bundles.flatMap((b) => b.events || []), world: last.world, cost: last.cost, economy: last.economy, angels: last.angels, relations: last.relations });
      }, () => { /* the feed is optional: the recording still works */ });
    } catch (e) { /* ignore */ }
  }
  async function connectServer() {
    const r = await fetch('/api/bootstrap'); if (!r.ok) throw new Error('bootstrap failed');
    S.server = true; $('liveControls').hidden = false;
    ingest(await r.json());
    openSocket();
  }
  function openSocket() {
    const sinceTick = S.frames.length ? S.frames[S.frames.length - 1].tick : -1;
    const sinceEv = S.events.length ? S.events[S.events.length - 1].id : 0;
    let ws; try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?since_tick=${sinceTick}&since_event=${sinceEv}`); } catch (e) { return; }
    ws.onmessage = (m) => applyUpdate(JSON.parse(m.data));
    ws.onclose = () => { $('statusText').textContent = W().reconnecting; setTimeout(openSocket, 2000); };
    ws.onerror = () => { try { ws.close(); } catch (e) { /* ignore */ } };
  }
  async function control(action, value) {
    try {
      const r = await fetch('/api/control', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, value }) });
      const j = await r.json(); if (j.ok) { S.data.world = j.world; renderClock(); toast(action === 'speed' ? W().toastSpeed(value) : action === 'pause' ? W().toastPause : W().toastResume); }
    } catch (e) { toast(W().noServer); }
  }

  // ---------------------------------------------------------------- wiring
  $('scrub').addEventListener('input', (e) => goTo(Number(e.target.value), { byUser: true }));
  $('btnPrev').addEventListener('click', () => goTo(S.cur - 1, { byUser: true }));
  $('btnNext').addEventListener('click', () => goTo(S.cur + 1, { byUser: true }));
  $('btnLive').addEventListener('click', () => { S.follow = true; stopPlay(); goTo(S.frames.length - 1); });
  function stopPlay() { S.playing = false; clearInterval(S.playTimer); S.playTimer = null; renderTimeline(); }
  $('btnPlay').addEventListener('click', () => {
    if (S.playing) return stopPlay();
    if (S.cur >= S.frames.length - 1) S.cur = 0;
    S.playing = true; S.follow = false;
    S.playTimer = setInterval(() => { if (S.cur >= S.frames.length - 1) return stopPlay(); goTo(S.cur + 1); }, 1100);
    renderTimeline();
  });
  $('btnPause').addEventListener('click', () => control(S.data.world.paused ? 'resume' : 'pause'));
  $('speedSel').addEventListener('change', (e) => control('speed', Number(e.target.value)));
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.f === 'routine') S.routine = !S.routine; else S.filter = b.dataset.f;
    renderFilters(); renderStory();
  });
  $('langBtn').addEventListener('click', () => { LANG = LANG === 'ru' ? 'en' : 'ru'; try { localStorage.setItem('asapville.lang', LANG); } catch (e) { /* ignore */ } renderAll(); });
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.key === 'ArrowLeft') goTo(S.cur - 1, { byUser: true });
    else if (e.key === 'ArrowRight') goTo(S.cur + 1, { byUser: true });
    else if (e.key === 'Home') goTo(0, { byUser: true });
    else if (e.key === 'End') { S.follow = true; goTo(S.frames.length - 1); }
    else if (e.key === ' ') { e.preventDefault(); $('btnPlay').click(); }
    else if (e.key === 'Escape' && S.selected != null) select(S.selected);
  });
  setInterval(() => { if (S.data && !S.server) renderClock(); }, 30000);

  // ---------------------------------------------------------------- boot
  try { const t = localStorage.getItem('asapville.tab'); if (TAB_KEYS.includes(t)) S.tab = t; } catch (e) { /* ignore */ }
  const slot = $('asapville-data');
  const embedded = slot && slot.textContent.trim();
  if (embedded) {
    ingest(JSON.parse(embedded));
    openTab(S.tab);
    listenDb();
  } else {
    connectServer().then(() => openTab(S.tab)).catch(() => { $('statusText').textContent = W().noServer; });
  }
  (async () => {
    if (!window.claude || !window.claude.use) { $('askNote').textContent = W().ask.off; return; }
    try { sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
    if (!sampleFn) $('askNote').textContent = W().ask.off;
  })();
})();
</script>
